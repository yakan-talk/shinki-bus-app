name: Keep Render Alive (12:00 - 16:00 JST)

on:
  schedule:
    # 日本時間 12:00〜16:00 (JST) = UTC 03:00〜07:00
    # スリープ(15分)を防ぐため 10分おきに ping
    - cron: '*/10 3-7 * * *'
  workflow_dispatch: # GitHub画面から手動テスト実行可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_APP_URL secret is not set, checking fallback..."
            # GitHub Secrets に未設定の場合は直接URLを書き換えても動きます
            URL="https://shinki-bus-app.onrender.com"
          fi
          echo "Pinging $URL ..."
          curl -sS -I "$URL" | head -n 5
